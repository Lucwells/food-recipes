<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Recipes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>My Recipes</h1>
  <input id="search" type="search" placeholder="Search title, ingredient, tag...">
</header>
<main>
  <section id="pantry">
    <label for="pantry-input"><b>My ingredients</b> <span class="meta">(type one, press Enter)</span></label>
    <input id="pantry-input" type="text" placeholder="e.g. ground beef, onion, flour...">
    <div id="pantry-chips"></div>
    <label class="meta"><input id="only-full" type="checkbox"> Only show recipes I can fully make</label>
  </section>
  <div id="tags"></div>
  <div id="grid"></div>
  <article id="detail" hidden></article>
</main>
<script src="recipes.js"></script>
<script src="app.js"></script>
</body>
</html>
